[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "vapt-sanitize"
version = "1.0.0"
description = "Local-first sanitization gateway for authorized VAPT data and AI handoff workflows."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyYAML==6.0.3",
    "cryptography==50.0.2",
]

[project.scripts]
vapt-sanitize = "vapt_sanitize.__main__:main"

[tool.setuptools.packages.find]
include = ["vapt_sanitize*"]
